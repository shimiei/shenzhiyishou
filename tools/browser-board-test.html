<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>围棋在线对局（识别测试页）</title>
<style>
  body { margin: 0; background: #eceff4; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; color: #223; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 0 40px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .meta { color: #667; font-size: 12px; margin-bottom: 10px; }
  .board { background: #dcb35c; border: 10px solid #b98c3c; border-radius: 4px; display: inline-block; line-height: 0; }
  .side { margin-top: 10px; font-size: 12px; color: #556; }
  .pill { display: inline-block; background: #fff; border: 1px solid #ccd; border-radius: 999px; padding: 1px 9px; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>对局室 · 第 3 局</h1>
  <div class="meta">黑：测试棋手（9d）　白：对手（9d）　时限：各 30 分钟　贴目 7.5</div>
  <div class="board" id="boardBox"><canvas id="board" width="640" height="640"></canvas></div>
  <div class="side">
    <span class="pill" id="pillMoves">手数 24</span><span class="pill" id="pillBlack">黑 12 子</span><span class="pill" id="pillWhite">白 12 子</span><span class="pill" id="pillTurn">黑方行棋</span>
    <button id="oppBtn" style="margin-left:6px">对手走一手</button>
    <div id="log" style="margin-top:6px;color:#778"></div>
  </div>
</div>
<script>
  // 一条固定不变的测试局面：谁被改了都跑不过比对。
  // ?start=empty 从空盘开局，验收实时截取时用：本地开一盘空的，两边同一出发点。
  const QS = new URLSearchParams(location.search);
  const START_EMPTY = QS.get('start') === 'empty';
  const BLACK = START_EMPTY ? [] : ['D4', 'Q4', 'D16', 'Q16', 'K10', 'C10', 'R10', 'Q10', 'D10', 'F5', 'Q14', 'D14'];
  const WHITE = START_EMPTY ? [] : ['C6', 'R6', 'C14', 'R14', 'Q5', 'D5', 'K16', 'K4', 'F17', 'C3', 'R17', 'Q12'];
  const LETTERS = 'ABCDEFGHJKLMNOPQRSTUVWXYZ';
  const SIZE = 19;
  // 棋盘跟着窗口宽度走：真实的对局站也是这样，分屏窄的时候会自动缩小。
  // ?px= 可以钉死尺寸：分屏矮的时候要靠它把整块棋盘塞进截图里，识别只认整块的棋盘。
  const FIXED_PX = Number(QS.get('px')) || 0;
  // 宽和高都要看：分屏可能是又宽又矮的一条，只看宽度会把棋盘画到画面外面去，
  // 而识别要求整块棋盘都在截图里。
  const measure = () =>
    FIXED_PX
      ? Math.max(140, Math.min(640, FIXED_PX))
      : Math.max(160, Math.min(640, window.innerWidth - 26, window.innerHeight - 26));
  let PX = measure();
  const MARGIN = () => PX * 0.072;
  const step = () => (PX - MARGIN() * 2) / (SIZE - 1);
  const at = (v) => {
    const x = LETTERS.indexOf(v[0].toUpperCase());
    const y = SIZE - parseInt(v.slice(1), 10);
    return [MARGIN() + x * step(), MARGIN() + y * step()];
  };
  const gi = (v) => (SIZE - parseInt(v.slice(1), 10)) * SIZE + LETTERS.indexOf(v[0].toUpperCase());
  const cv = document.getElementById('board');
  const ctx = cv.getContext('2d');
  // 两套画法：
  // 默认是本机页面那种深色格线、白子最亮处接近纯白的画法；
  // ?style=yike 是另一种客户端的样子：亮橙木色配蓝格线，白子是带明暗的灰球面，
  // 整圈取样的亮度跟木色差不多甚至更低，格线还画在棋子上层。识别就是在这一种上翻过车。
  const STYLE = QS.get('style') === 'yike' ? 'yike' : 'default';
  const PAL = STYLE === 'yike'
    ? {
        wood: ['#fed57b', '#febd73', '#f2ab63'],
        line: 'rgba(104,151,198,1)',
        star: 'rgba(150,170,200,0.9)',
        black: [0, '#6a6a72', 0.35, '#2a2c30', 1, '#0c0e12'],
        white: [0, '#fafafa', 0.25, '#e1e1e1', 0.6, '#bebebe', 1, '#acacac'],
        outline: { b: 'rgba(0,0,0,0.45)', w: 'rgba(120,120,112,0.45)' },
        linesOver: true
      }
    : {
        wood: ['#e3bd6c', '#dcb35c', '#d3a94f'],
        line: 'rgba(78,50,14,0.75)',
        star: 'rgba(60,38,10,0.85)',
        black: [0, '#6a6a72', 0.45, '#242429', 1, '#0a0a0d'],
        white: [0, '#ffffff', 0.6, '#f2f2f0', 1, '#cfcfc8'],
        outline: { b: 'rgba(0,0,0,0.5)', w: 'rgba(120,120,110,0.55)' },
        linesOver: false
      };
  function drawLines(M, sp) {
    ctx.strokeStyle = PAL.line;
    ctx.lineWidth = Math.max(0.8, PX / 560) * (STYLE === 'yike' ? 1.6 : 1);
    for (let i = 0; i < SIZE; i++) {
      const p = M + i * sp;
      ctx.beginPath();
      ctx.moveTo(M, p); ctx.lineTo(PX - M, p);
      ctx.moveTo(p, M); ctx.lineTo(p, PX - M);
      ctx.stroke();
    }
    ctx.fillStyle = PAL.star;
    for (const [sx, sy] of [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]]) {
      ctx.beginPath();
      ctx.arc(M + sx * sp, M + sy * sp, Math.max(1.8, sp * 0.1), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function draw() {
    PX = measure();
    cv.width = PX;
    cv.height = PX;
    const M = MARGIN();
    const sp = step();
    ctx.clearRect(0, 0, PX, PX);
    // 木纹底
    const grad = ctx.createLinearGradient(0, 0, PX, PX);
    grad.addColorStop(0, PAL.wood[0]);
    grad.addColorStop(0.5, PAL.wood[1]);
    grad.addColorStop(1, PAL.wood[2]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, PX, PX);
    if (!PAL.linesOver) drawLines(M, sp);
    const R = sp * (STYLE === 'yike' ? 0.46 : 0.47);
    function stone(v, color) {
      const [x, y] = at(v);
      ctx.beginPath();
      ctx.arc(x + R * 0.09, y + R * 0.12, R, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fill();
      const g = ctx.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.15, x, y, R);
      const stops = color === 'b' ? PAL.black : PAL.white;
      for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]);
      ctx.beginPath();
      ctx.arc(x, y, R, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = color === 'b' ? PAL.outline.b : PAL.outline.w;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    WHITE.forEach((v) => stone(v, 'w'));
    BLACK.forEach((v) => stone(v, 'b'));
    if (PAL.linesOver) drawLines(M, sp);
  }
  if (STYLE === 'yike') {
    const box = document.getElementById('boardBox');
    box.style.background = '#febd73';
    box.style.borderColor = '#e0a253';
  }
  // ?bare=1 只留棋盘：验收实时截取时用，分屏那块本来就不大，页面上的标题和比分
  // 会把棋盘挤小，而识别只认整块的棋盘。
  if (QS.get('bare') === '1') {
    document.querySelector('h1').style.display = 'none';
    document.querySelector('.meta').style.display = 'none';
    document.querySelector('.side').style.display = 'none';
    document.querySelector('.wrap').style.padding = '0';
  }

  // ---- 交互部分：给自动落子与实时截取做验收 ----
  // 盘面从上面那两条固定棋谱起步，之后再落的子都记在这张表里：
  // 点哪落哪（轮到谁就落谁的），谁都点不了的地方不落，模拟真实站点对非法着法的拒绝。
  const board = new Map();
  BLACK.forEach((v) => board.set(v, 'b'));
  WHITE.forEach((v) => board.set(v, 'w'));
  let toMove = 'b';
  let moveNo = START_EMPTY ? 0 : 24;
  const clicks = [];
  const logs = [];
  function drawAll() {
    draw();  // 底图 + 初始固定棋谱
    const sp = step();
    const R = sp * (STYLE === 'yike' ? 0.46 : 0.47);
    function stoneAt([x, y], color) {
      const g = ctx.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.15, x, y, R);
      const stops = color === 'b' ? PAL.black : PAL.white;
      for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]);
      ctx.beginPath();
      ctx.arc(x, y, R, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = color === 'b' ? PAL.outline.b : PAL.outline.w;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    for (const [v, c] of board) {
      if (BLACK.includes(v) || WHITE.includes(v)) continue;  // 初始的那些上面已经画了
      stoneAt(pointOf(v), c);
    }
    if (lastMove) {
      // 最后一手的红点，跟真站点一样：识别要能透过这个点认出棋子
      const [ix, iy] = pointOf(lastMove);
      ctx.beginPath();
      ctx.arc(ix, iy, Math.max(2, R * 0.22), 0, Math.PI * 2);
      ctx.fillStyle = '#e0453a';
      ctx.fill();
    }
    document.getElementById('pillMoves').textContent = '手数 ' + moveNo;
    document.getElementById('pillBlack').textContent = '黑 ' + [...board.values()].filter((c) => c === 'b').length + ' 子';
    document.getElementById('pillWhite').textContent = '白 ' + [...board.values()].filter((c) => c === 'w').length + ' 子';
    document.getElementById('pillTurn').textContent = toMove === 'b' ? '黑方行棋' : '白方行棋';
  }
  function pointOf(v) {
    const x = LETTERS.indexOf(v[0].toUpperCase());
    const y = SIZE - parseInt(v.slice(1), 10);
    return [MARGIN() + x * step(), MARGIN() + y * step()];
  }
  function vertexAt(px, py) {
    const M = MARGIN();
    const sp = step();
    const x = Math.round((px - M) / sp);
    const y = Math.round((py - M) / sp);
    if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return null;
    // 离交叉点太远的点击不算落子：真站点也是这样，点到棋盘的空白处什么都不发生
    if (Math.hypot(px - (M + x * sp), py - (M + y * sp)) > sp * 0.7) return null;
    return LETTERS[x] + (SIZE - y);
  }
  let lastMove = null;
  function play(v, color) {
    if (!v || board.has(v)) return false;
    board.set(v, color);
    lastMove = v;
    moveNo += 1;
    toMove = color === 'b' ? 'w' : 'b';
    logs.push(`${moveNo}. ${color === 'b' ? '黑' : '白'} ${v}`);
    document.getElementById('log').textContent = logs.slice(-3).join('　');
    drawAll();
    return true;
  }
  /*
   * 验收用的三个钩子（只有驱动会设，用户在页面上点不到）：
   *   __dropNext   接下来这么多下点击当"网站没接住"：点记下来，但不落子；
   *   __dropThenPlaceAt  把点击吞掉，过这么多毫秒再自己把那一颗摆上（那边画得慢）；
   *   __placeLater 多少毫秒之后直接在某个点摆一颗子（那边早就有这一手了，或者走的是别的点）。
   */
  window.__dropNext = 0;
  window.__dropThenPlaceAt = 0;
  let lateSeq = 0;
  cv.addEventListener('click', (e) => {
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left;
    const py = e.clientY - r.top;
    const v = vertexAt(px, py);
    clicks.push({ px, py, vertex: v, color: toMove, at: Date.now() });
    if (window.__dropNext > 0) {
      window.__dropNext -= 1;
      return;
    }
    if (window.__dropThenPlaceAt > 0) {
      const ms = window.__dropThenPlaceAt;
      window.__dropThenPlaceAt = 0;
      const color = toMove;
      // 排在这一下之后的那些点击不算数：这里只是把"晚一步画出来"演出来
      const mine = ++lateSeq;
      setTimeout(() => {
        if (mine === lateSeq) play(v, color);
      }, ms);
      return;
    }
    play(v, toMove);
  });
  window.__placeLater = (v, color, ms) => {
    setTimeout(() => play(v, color), ms);
    return true;
  };
  // 对手自动走一手（验收时用 CDP 调，或者直接点按钮）
  window.__opponentMove = (v) => {
    if (v) return play(v, toMove);
    const empty = [];
    for (let x = 2; x < SIZE - 2; x++) {
      for (let y = 2; y < SIZE - 2; y++) {
        const cand = LETTERS[x] + (SIZE - y);
        if (!board.has(cand)) empty.push(cand);
      }
    }
    // 挑靠近中心的一个空点，别乱丢在边上
    empty.sort((a, b) => {
      const d = (v) => Math.abs(LETTERS.indexOf(v[0]) - 9) + Math.abs(SIZE - parseInt(v.slice(1), 10) - 9);
      return d(a) - d(b);
    });
    return play(empty[Math.min(empty.length - 1, Math.floor(empty.length * 0.3))], toMove);
  };
  window.__state = () => ({
    size: SIZE,
    toMove,
    moveNo,
    lastMove,
    clicks: clicks.slice(),
    stones: [...board.entries()].map(([v, c]) => ({ v, c }))
  });
  document.getElementById('oppBtn').addEventListener('click', () => window.__opponentMove());

  drawAll();
  window.addEventListener('resize', drawAll);

  // 供比对用：坐标与索引
  window.__expected = {
    style: STYLE,
    size: SIZE,
    black: BLACK, white: WHITE,
    blackIdx: BLACK.map(gi), whiteIdx: WHITE.map(gi)
  };
</script>
</body>
</html>

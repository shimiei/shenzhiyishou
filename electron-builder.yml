appId: com.shenzhiyishou.app
productName: 神之一手
copyright: © 2026 shimiei
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  # 跑自测和验收实例时会把几个入口编到 dist 里（tests 的 *.mjs、
  # main/index.devtest.js），它们只在开发机上用，不该跟着安装包走。
  - '!dist/*.mjs'
  - '!dist/main/*.devtest.js'
extraResources:
  # 本项目的 MIT 许可与第三方声明（KataGo 网络的许可要求随附声明，Electron 与
  # Chromium 的声明由 electron-builder 自己放在 exe 旁边）跟着安装包一起走。
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: engine
    to: engine
    filter:
      - '**/*'
      - '!**/gtp_logs/**'
      - '!**/*.log'
  # 按约定只随包带小网络（b6c96，4.7 MB）；大网络交给应用内下载，
  # 否则安装包会从 60 MB 膨胀到 400 MB 以上。
  - from: models
    to: models
    filter:
      - 'b6c96-s175395328-d26788732/model.txt.gz'
      - 'b6c96-s175395328-d26788732/model.config.json'
      - '!**/*.bin.gz'
      - '!**/saved_model/**'
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: 神之一手-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 神之一手
  installerLanguages:
    - zh_CN
  language: '2052'
portable:
  artifactName: 神之一手-便携版-${version}.${ext}
